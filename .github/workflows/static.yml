name: Deploy menu maker (with secrets injected)
 
on:
  push:
    branches: [main]
  workflow_dispatch:
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: pages
  cancel-in-progress: true
 
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Copy source into a build folder
        run: |
          mkdir -p dist
          cp index.html dist/index.html
 
      - name: Inject secrets
        run: |
          if [ -z "${{ secrets.MENU_GROQ_API_KEY }}" ] || [ -z "${{ secrets.MENU_GITHUB_TOKEN }}" ]; then
            echo "::error::Missing repo secret(s). Add MENU_GROQ_API_KEY and MENU_GITHUB_TOKEN under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          sed -i "s|__GROQ_API_KEY__|${{ secrets.MENU_GROQ_API_KEY }}|g" dist/index.html
          sed -i "s|__GITHUB_TOKEN__|${{ secrets.MENU_GITHUB_TOKEN }}|g" dist/index.html
 
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
 
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
