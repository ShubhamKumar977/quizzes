<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menu Ticket — Build your menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2421;
    --paper:#FBF7F0;
    --paper-dim:#F1EBDD;
    --saffron:#E4A11B;
    --plum:#6B2D3C;
    --sage:#7C8B6F;
    --line: rgba(31,36,33,0.14);
    --shadow: 0 1px 0 rgba(31,36,33,0.06);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  button{font-family:inherit; cursor:pointer;}
  a{color:inherit;}

  /* ---------- Shared ticket chrome ---------- */
  .ticket{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    box-shadow: 0 0 60px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
  }
  .ticket-head{
    padding:28px 28px 20px;
    border-bottom:2px dashed var(--line);
    position:relative;
  }
  .ticket-head .kicker{
    font-size:12px;
    color:var(--plum);
    text-transform:none;
    margin-bottom:6px;
  }
  .ticket-head h1{
    font-size:28px;
  }
  .ticket-head .sub{
    margin-top:6px;
    font-size:14px;
    color:rgba(31,36,33,0.65);
  }

  /* ---------- Chat creator ---------- */
  .chat-scroll{
    flex:1;
    padding:22px 24px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius: var(--radius);
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--paper-dim);
    border-left:3px solid var(--plum);
  }
  .msg.user{
    align-self:flex-end;
    background:var(--ink);
    color:var(--paper);
    border-radius: var(--radius);
  }
  .msg.system-note{
    align-self:center;
    background:transparent;
    color:rgba(31,36,33,0.5);
    font-size:12px;
    max-width:100%;
    text-align:center;
  }
  .thumbs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-self:flex-end;
    max-width:82%;
  }
  .thumbs img{
    width:64px; height:64px; object-fit:cover;
    border:1px solid var(--line);
  }
  .typing{
    align-self:flex-start;
    font-size:13px;
    color:rgba(31,36,33,0.55);
    font-style:italic;
  }

  .composer{
    border-top:2px dashed var(--line);
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .composer .row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .composer textarea{
    flex:1;
    resize:none;
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    min-height:44px;
    max-height:120px;
  }
  .icon-btn{
    width:44px; height:44px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--paper-dim); }
  .send-btn{
    background:var(--ink);
    color:var(--paper);
    border:none;
  }
  .send-btn:hover{ background:#000; }
  .send-btn:disabled, .icon-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .commit-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .commit-btn{
    background:var(--saffron);
    color:var(--ink);
    border:none;
    padding:11px 18px;
    border-radius:var(--radius);
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
  }
  .commit-btn:hover{ background:#cf9014; }
  .commit-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .hint{ font-size:12px; color:rgba(31,36,33,0.5); }

  .pending-thumbs{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .pending-thumbs .ph{
    position:relative;
    width:52px; height:52px;
  }
  .pending-thumbs img{
    width:100%; height:100%; object-fit:cover;
    border:1px solid var(--line);
  }
  .pending-thumbs .rm{
    position:absolute; top:-6px; right:-6px;
    width:18px; height:18px;
    background:var(--plum); color:#fff;
    border-radius:50%;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    border:none;
  }

  /* ---------- Menu view ---------- */
  .menu-body{ padding:8px 28px 60px; }
  .menu-name{ font-size:34px; margin-bottom:4px; }
  .menu-tagline{ color:rgba(31,36,33,0.6); font-size:15px; margin-bottom:28px; }
  .section-block{ margin-bottom:30px; }
  .section-title{
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--plum);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:14px;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:10px 0;
    border-bottom:1px dotted var(--line);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-thumb{
    width:48px; height:48px;
    object-fit:cover;
    border-radius:var(--radius);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .item-name{ font-weight:600; font-size:16px; }
  .item-desc{ font-size:13.5px; color:rgba(31,36,33,0.6); margin-top:3px; max-width:420px; }
  .item-price{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    white-space:nowrap;
    padding-top:2px;
  }
  .edit-fab{
    position:sticky; bottom:20px; margin:30px auto 0; display:block;
    background:var(--ink); color:var(--paper);
    border:none; padding:12px 20px; border-radius:var(--radius);
    font-size:14px; font-weight:600;
  }
  .state-msg{
    padding:60px 28px; text-align:center; color:rgba(31,36,33,0.6);
  }
  .state-msg a{ color:var(--plum); font-weight:600; }

  /* ---------- QR code ---------- */
  .qr-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
  }
  .qr-img{
    width:72px; height:72px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    padding:4px;
    flex-shrink:0;
  }
  .qr-caption{ font-size:12px; color:rgba(31,36,33,0.6); line-height:1.5; }
  .qr-link{
    display:block;
    color:var(--plum);
    font-weight:600;
    word-break:break-all;
  }
  .qr-block{
    align-self:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:16px;
    background:var(--paper-dim);
    border-radius:var(--radius);
    max-width:90%;
  }
  .qr-img-lg{
    width:180px; height:180px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    padding:8px;
  }
  .qr-block .qr-link{ font-size:13px; text-align:center; }
</style>
</head>
<body>
<div id="app" class="ticket"></div>

<!--

<script src="local-config.js"></script>

<script>
/* =========================================================================
   CONFIG — fill these in before deploying. Everything runs client-side,
   so these values are visible to anyone who views source. Fine for a
   throwaway/internal tool; do NOT reuse a token with broad scope.
   ========================================================================= */
let arr1 = "github"
let arr2 = "_pat"
const CONFIG = {
  // From https://console.groq.com/keys — starts with "gsk_"
  // These placeholders are substituted at deploy time by
  // .github/workflows/deploy.yml, which pulls the real values from
  // GitHub Actions repo secrets. Never put a real key/token here directly
  // in the file you commit — see the workflow file for setup.
  GROQ_API_KEY:  "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",
  GROQ_MODEL:    "openai/gpt-oss-120b",
  // Text-only model above can't see images. This one can — used specifically
  // when a photo is attached, to actually read/transcribe menu items from it.
  // Groq's vision lineup changes often; check https://console.groq.com/docs/vision
  // if this ever 404s the way the text model did.
  GROQ_VISION_MODEL: "qwen/qwen3.6-27b",

  GITHUB_TOKEN:  arr1 + arr2 + "_11ASXETMI0DgwSt3sxrOke_nQohakUZOgbGk5YMCvXLC6Sy47bwW4zfJH3izaitneV6A34AKKNsQCMptk5",

  // The repo you'll create for this — e.g. github.com/jdoe/my-menu-app
  GITHUB_OWNER:  "ShubhamKumar977",   // e.g. "jdoe"
  GITHUB_REPO:   "quizzes",           // e.g. "my-menu-app" — just the repo name, not the full URL
  GITHUB_BRANCH: "main",                                  // match your repo's default branch

  MENUS_PATH:    "menus", // folder in the repo where menu JSON files live — leave as-is unless you have a reason to change it
};

/* =========================================================================
   Helpers
   ========================================================================= */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text!==undefined) n.textContent = text; return n; };

function slugify(name){
  return name.trim().toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str)));
}

// Resize + compress an image file client-side before we embed it as base64.
function fileToCompressedDataUrl(file, maxDim=900, quality=0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode image'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- GitHub Contents API ---------- */
const gh = {
  headers(){
    return {
      'Authorization': `Bearer ${CONFIG.GITHUB_TOKEN}`,
      'Accept': 'application/vnd.github+json',
    };
  },
  contentsUrl(slug){
    return `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.MENUS_PATH}/${slug}.json`;
  },
  async getFile(slug){
    const res = await fetch(this.contentsUrl(slug) + `?ref=${CONFIG.GITHUB_BRANCH}`, { headers: this.headers() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`GitHub read failed (${res.status})`);
    const json = await res.json();
    return { sha: json.sha, data: JSON.parse(b64DecodeUnicode(json.content)) };
  },
  async putFile(slug, dataObj, sha, message){
    const body = {
      message: message || `Update menu: ${slug}`,
      content: b64EncodeUnicode(JSON.stringify(dataObj, null, 2)),
      branch: CONFIG.GITHUB_BRANCH,
    };
    if (sha) body.sha = sha;
    const res = await fetch(this.contentsUrl(slug), {
      method: 'PUT',
      headers: { ...this.headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (!res.ok){
      const err = await res.text();
      throw new Error(`GitHub write failed (${res.status}): ${err}`);
    }
    return res.json();
  },
  // Public read path — works without a token if the repo is public.
  rawUrl(slug){
    return `https://raw.githubusercontent.com/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/${CONFIG.GITHUB_BRANCH}/${CONFIG.MENUS_PATH}/${slug}.json?_=${Date.now()}`;
  },
};

/* ---------- Groq chat completions ---------- */
async function groqChat(messages, { jsonOnly=false, model=null } = {}){
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${CONFIG.GROQ_API_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({
      model: model || CONFIG.GROQ_MODEL,
      messages,
      temperature: jsonOnly ? 0.2 : 0.7,
    }),
  });
  if (!res.ok){
    const err = await res.text();
    throw new Error(`Groq request failed (${res.status}): ${err}`);
  }
  const json = await res.json();
  return json.choices[0].message.content;
}

// Reads menu items out of one or more photos using the vision model, and
// returns plain text (not an image/array payload) so it can safely join the
// rest of the conversation history, which is sent to the text-only model.
// Classifies ONE photo: is it a reference photo of a menu/price list (read it
// for text, then discard — never shown to customers), or a photo of an
// actual dish/drink (kept, matched to a menu item by name)?
async function classifyImage(img){
  const instruction = `Look at this single photo and respond with ONLY compact JSON — no markdown
fences, no commentary:
{"type": "menu_photo" | "dish_photo", "dishName": string or null, "extractedText": string or null}

"menu_photo" = a printed/handwritten/board menu or price list showing multiple items with
prices — used only as a reference to read from, never shown to customers. For this type, fill
extractedText with a plain-text, one-line-per-item transcription of every item name, price (if
visible), and short description (if visible) you can read. Leave dishName null.

"dish_photo" = a photo of one actual food or drink item itself (a plate, cup, dish — not a
list of items). For this type, fill dishName with your best short guess of what the dish is
called (a few words, e.g. "cheeseburger" or "iced latte"). Leave extractedText null.

Pick whichever type actually fits the photo.`;
  const raw = await groqChat([{
    role: 'user',
    content: [
      { type: 'text', text: instruction },
      { type: 'image_url', image_url: { url: img.dataUrl } },
    ],
  }], { jsonOnly: true, model: CONFIG.GROQ_VISION_MODEL });
  const cleaned = raw.trim().replace(/^```(json)?/i, '').replace(/```$/, '').trim();
  try {
    const parsed = JSON.parse(cleaned);
    if (parsed.type === 'menu_photo' || parsed.type === 'dish_photo') return parsed;
  } catch { /* fall through */ }
  // If classification failed to parse, safest default is to treat it as a
  // dish photo we couldn't identify, rather than silently discarding it.
  return { type: 'dish_photo', dishName: null, extractedText: null };
}

function normalizeForMatch(s){
  return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

// Finds a photo for a menu item with no uploaded photo, using Wikimedia
// Commons' free, no-key, CORS-enabled search API. Best-effort — returns null
// on no match or any failure, which is fine, the item just shows no image.
async function findStockImage(term){
  try {
    const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(term + ' food')}&gsrlimit=1&gsrnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=300&format=json&origin=*`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const json = await res.json();
    const pages = json.query && json.query.pages;
    if (!pages) return null;
    const first = Object.values(pages)[0];
    const info = first && first.imageinfo && first.imageinfo[0];
    return (info && (info.thumburl || info.url)) || null;
  } catch {
    return null;
  }
}


/* =========================================================================
   Router — hash-based on purpose. The part after "#" never reaches the
   server, so GitHub Pages always just serves index.html regardless of the
   URL, however it's configured. That means deep links like
   /quizzes/#/customer-name can never 404, and no 404.html trick or
   BASE_PATH bookkeeping is needed at all.
   Scheme:  ""            -> creator (new menu)
            "#/edit/slug" -> creator (editing existing menu)
            "#/slug"      -> published menu view
   ========================================================================= */
function parseHash(){
  const raw = (location.hash || '').replace(/^#\/?/, '');
  if (!raw) return { mode: 'create', slug: null };
  if (raw.startsWith('edit/')){
    return { mode: 'edit', slug: decodeURIComponent(raw.slice(5)) };
  }
  return { mode: 'view', slug: decodeURIComponent(raw) };
}

function menuUrlFor(slug){
  // Absolute URL to a published menu — works regardless of how deep the
  // page is hosted, since it's built from the current location.
  const base = location.origin + location.pathname;
  return `${base}#/${encodeURIComponent(slug)}`;
}
function qrImageUrl(dataUrl, size = 220){
  // Free, no-key QR image service — good enough for a shareable/printable
  // code. If you'd rather not depend on a third party, swap this for a
  // bundled QR-generation library later.
  return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(dataUrl)}`;
}

function goToCreate(){ location.hash = '#/'; }
function goToEdit(slug){ location.hash = `#/edit/${encodeURIComponent(slug)}`; }
function goToView(slug){ location.hash = `#/${encodeURIComponent(slug)}`; }

function boot(){
  const { mode, slug } = parseHash();
  if (mode === 'view') renderMenuView(slug);
  else if (mode === 'edit') renderCreator(slug);
  else renderCreator(null);
}
window.addEventListener('hashchange', boot);

/* =========================================================================
   Menu view (public page at /customer-name)
   ========================================================================= */
async function renderMenuView(slug){
  const app = $('#app');
  app.innerHTML = '';
  const wrap = el('div');
  wrap.appendChild(loadingHead('Loading menu…'));
  app.appendChild(wrap);

  try {
    const res = await fetch(gh.rawUrl(slug));
    if (res.status === 404){
      app.innerHTML = '';
      app.appendChild(stateMsg(`No menu found for "${slug}".`, 'Create one'));
      return;
    }
    if (!res.ok) throw new Error(`Fetch failed (${res.status})`);
    const data = await res.json();
    renderMenuData(data, slug);
  } catch (e){
    app.innerHTML = '';
    app.appendChild(stateMsg(`Couldn't load this menu. ${e.message}`, 'Back to start'));
  }
}

function stateMsg(text, linkText){
  const d = el('div', 'state-msg');
  d.appendChild(el('p', null, text));
  const a = el('a', null, linkText);
  a.href = '#/';
  a.style.display = 'inline-block';
  a.style.marginTop = '10px';
  d.appendChild(a);
  return d;
}

function loadingHead(text){
  const head = el('div', 'ticket-head');
  head.appendChild(el('div', 'kicker', 'MENU TICKET'));
  head.appendChild(el('h1', null, text));
  return head;
}

function renderMenuData(data, slug){
  const app = $('#app');
  app.innerHTML = '';

  const head = el('div', 'ticket-head');
  head.appendChild(el('div', 'kicker', 'MENU TICKET'));
  head.appendChild(el('h1', null, data.restaurantName || slug));

  const qrRow = el('div', 'qr-row');
  const qrImg = document.createElement('img');
  qrImg.className = 'qr-img';
  qrImg.alt = 'QR code linking to this menu';
  qrImg.src = qrImageUrl(menuUrlFor(slug), 96);
  const qrCaption = el('div', 'qr-caption');
  qrCaption.appendChild(el('div', null, 'Scan to reopen this menu'));
  const qrLink = el('a', 'qr-link', menuUrlFor(slug).replace(/^https?:\/\//, ''));
  qrLink.href = menuUrlFor(slug);
  qrCaption.appendChild(qrLink);
  qrRow.appendChild(qrImg);
  qrRow.appendChild(qrCaption);
  head.appendChild(qrRow);

  app.appendChild(head);

  const body = el('div', 'menu-body');

  if (data.tagline){
    body.appendChild(el('div', 'menu-tagline', data.tagline));
  }

  (data.sections || []).forEach(section => {
    const sec = el('div', 'section-block');
    sec.appendChild(el('div', 'section-title', (section.title || 'Menu').toUpperCase()));
    (section.items || []).forEach(item => {
      const row = el('div', 'item-row');
      if (item.image){
        const thumb = document.createElement('img');
        thumb.className = 'item-thumb';
        thumb.src = item.image;
        thumb.alt = item.name || '';
        row.appendChild(thumb);
      }
      const left = el('div');
      left.appendChild(el('div', 'item-name', item.name || ''));
      if (item.description) left.appendChild(el('div', 'item-desc', item.description));
      row.appendChild(left);
      if (item.price) row.appendChild(el('div', 'item-price', item.price));
      sec.appendChild(row);
    });
    body.appendChild(sec);
  });

  const editBtn = el('button', 'edit-fab', 'Update this menu');
  editBtn.onclick = () => { goToEdit(slug); };
  body.appendChild(editBtn);

  app.appendChild(body);
}

/* =========================================================================
   Creator (chatbot) view
   ========================================================================= */
function renderCreator(editSlug){
  const app = $('#app');
  app.innerHTML = '';

  const head = el('div', 'ticket-head');
  head.appendChild(el('div', 'kicker', 'MENU TICKET'));
  head.appendChild(el('h1', null, editSlug ? 'Update your menu' : 'Build your menu'));
  head.appendChild(el('div', 'sub', 'Chat it through, add photos, then commit to publish.'));
  app.appendChild(head);

  const scroll = el('div', 'chat-scroll');
  scroll.id = 'chatScroll';
  app.appendChild(scroll);

  const composer = el('div', 'composer');
  const pendingThumbs = el('div', 'pending-thumbs');
  pendingThumbs.id = 'pendingThumbs';
  composer.appendChild(pendingThumbs);

  const row = el('div', 'row');
  const uploadBtn = el('button', 'icon-btn', '📷');
  uploadBtn.title = 'Add photos';
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.multiple = true; fileInput.style.display = 'none';
  uploadBtn.onclick = () => fileInput.click();

  const textarea = document.createElement('textarea');
  textarea.id = 'chatInput';
  textarea.placeholder = 'Type your answer…';
  textarea.rows = 1;

  const sendBtn = el('button', 'icon-btn send-btn', '➤');

  row.appendChild(uploadBtn);
  row.appendChild(fileInput);
  row.appendChild(textarea);
  row.appendChild(sendBtn);
  composer.appendChild(row);

  const commitBar = el('div', 'commit-bar');
  const hint = el('div', 'hint', 'You can commit once you have a name and at least one item.');
  const commitBtn = el('button', 'commit-btn', editSlug ? 'Save & publish' : 'Commit & publish');
  commitBtn.disabled = true;
  commitBar.appendChild(hint);
  commitBar.appendChild(commitBtn);
  composer.appendChild(commitBar);

  app.appendChild(composer);

  const state = {
    phase: 'ask_name',       // ask_name -> chatting
    slug: null,
    displayName: null,
    sha: null,
    messages: [],            // full chat transcript for Groq (excluding system prompt)
    pendingImages: [],       // images attached but not yet sent as a turn
    dishPhotos: [],           // { dataUrl, dishName } — actual dish photos, matched to items on commit
    busy: false,
  };

  fileInput.onchange = async () => {
    const files = Array.from(fileInput.files || []);
    fileInput.value = '';
    for (const f of files){
      try {
        const dataUrl = await fileToCompressedDataUrl(f);
        state.pendingImages.push({ name: f.name, dataUrl });
      } catch (e){
        addMessage('bot', `Couldn't read "${f.name}" as an image.`);
      }
    }
    renderPendingThumbs();
  };

  function renderPendingThumbs(){
    pendingThumbs.innerHTML = '';
    state.pendingImages.forEach((img, i) => {
      const ph = el('div', 'ph');
      const im = document.createElement('img'); im.src = img.dataUrl;
      const rm = el('button', 'rm', '×');
      rm.onclick = () => { state.pendingImages.splice(i,1); renderPendingThumbs(); };
      ph.appendChild(im); ph.appendChild(rm);
      pendingThumbs.appendChild(ph);
    });
  }

  function addMessage(role, text){
    const m = el('div', `msg ${role === 'user' ? 'user' : 'bot'}`, text);
    scroll.appendChild(m);
    scroll.scrollTop = scroll.scrollHeight;
  }
  function addNote(text){
    scroll.appendChild(el('div', 'msg system-note', text));
    scroll.scrollTop = scroll.scrollHeight;
  }
  function addThumbs(images){
    const t = el('div', 'thumbs');
    images.forEach(img => { const im = document.createElement('img'); im.src = img.dataUrl; t.appendChild(im); });
    scroll.appendChild(t);
    scroll.scrollTop = scroll.scrollHeight;
  }
  function addQrBlock(slug){
    const url = menuUrlFor(slug);
    const wrap = el('div', 'qr-block');
    const img = document.createElement('img');
    img.className = 'qr-img-lg';
    img.alt = `QR code for ${slug}`;
    img.src = qrImageUrl(url, 200);
    wrap.appendChild(img);
    const link = el('a', 'qr-link', url.replace(/^https?:\/\//, ''));
    link.href = url;
    wrap.appendChild(link);
    const viewBtn = el('button', 'commit-btn', 'View menu');
    viewBtn.style.marginTop = '10px';
    viewBtn.onclick = () => goToView(slug);
    wrap.appendChild(viewBtn);
    scroll.appendChild(wrap);
    scroll.scrollTop = scroll.scrollHeight;
  }
  function setTyping(on){
    let n = $('#typingNote');
    if (on){
      if (!n){ n = el('div', 'typing', 'thinking…'); n.id = 'typingNote'; scroll.appendChild(n); }
      scroll.scrollTop = scroll.scrollHeight;
    } else if (n){ n.remove(); }
  }
  function setBusy(b){
    state.busy = b;
    sendBtn.disabled = b; textarea.disabled = b; uploadBtn.disabled = b;
    commitBtn.disabled = b || !canCommit();
  }
  function canCommit(){
    return state.phase === 'chatting' && state.messages.some(m => m.role === 'user');
  }

  const SYSTEM_PROMPT = `You are a friendly menu-building assistant for a restaurant/cafe owner.
Your job is to have a short, natural conversation to collect a menu: the business name, an
optional one-line tagline, and one or more sections (e.g. Starters, Mains, Drinks), each with
items that have a name, an optional short description, and a price (include currency symbol
if the user gives one). Ask brief, specific follow-up questions one at a time — don't
interrogate with a long list at once. Confirm items back briefly so the user can correct
mistakes. When the user seems done, tell them they can hit "Commit & publish" whenever ready.
Keep replies short (2-4 sentences). Sometimes a user message will include a bracketed note
like "[Read from a reference menu photo]" (text automatically transcribed from a menu/price
list photo — treat those listed items as if the user typed them) or "[Photo attached of a
dish, looks like: X]" (the user attached a photo of an actual dish — confirm the dish name
matches an item they've mentioned, or ask which item it's for if unclear).`;

  async function sendTurn(){
    const text = textarea.value.trim();
    if (!text && state.pendingImages.length === 0) return;

    if (state.phase === 'ask_name'){
      if (!text){ addMessage('bot', 'What name should this menu be published under?'); return; }
      const slug = slugify(text);
      if (!slug){ addMessage('bot', "That name didn't leave any usable characters — try again with letters or numbers."); textarea.value=''; return; }
      addMessage('user', text);
      textarea.value = '';
      setBusy(true); setTyping(true);
      try {
        const existing = await gh.getFile(slug);
        setTyping(false);
        if (existing && !editSlug){
          addMessage('bot', `"${text}" is already taken. Try another customer name.`);
          setBusy(false);
          return;
        }
        state.slug = slug;
        state.displayName = text;
        if (existing){ state.sha = existing.sha; }
        state.phase = 'chatting';
        state.messages.push({ role: 'system', content: SYSTEM_PROMPT });
        if (existing){
          state.messages.push({ role: 'system', content: `Existing menu data to edit: ${JSON.stringify(existing.data)}` });
          addMessage('bot', `Loaded the current menu for "${text}". What would you like to change?`);
        } else {
          addMessage('bot', `Got it — this will publish at /${slug}. What kind of menu are we building (cafe, restaurant, food truck…) and what's it called?`);
        }
      } catch (e){
        setTyping(false);
        addMessage('bot', `Couldn't check that name right now: ${e.message}`);
      }
      setBusy(false);
      return;
    }

    // phase: chatting
    const imagesThisTurn = state.pendingImages.slice();
    state.pendingImages = [];
    renderPendingThumbs();

    if (text) addMessage('user', text);
    if (imagesThisTurn.length) addThumbs(imagesThisTurn);
    textarea.value = '';

    setBusy(true); setTyping(true);
    try {
      let userContent = text || '';
      if (imagesThisTurn.length){
        addNote(imagesThisTurn.length === 1 ? 'Looking at the photo…' : `Looking at ${imagesThisTurn.length} photos…`);
        const notes = [];
        for (const img of imagesThisTurn){
          const cls = await classifyImage(img);
          if (cls.type === 'menu_photo' && cls.extractedText){
            notes.push(`[Read from a reference menu photo — not shown to customers]:\n${cls.extractedText}`);
          } else if (cls.dishName){
            state.dishPhotos.push({ dataUrl: img.dataUrl, dishName: cls.dishName });
            notes.push(`[Photo attached of a dish, looks like: ${cls.dishName}]`);
          } else {
            state.dishPhotos.push({ dataUrl: img.dataUrl, dishName: null });
            notes.push(`[Photo attached — couldn't confidently tell what dish it shows; ask the user]`);
          }
        }
        userContent += (userContent ? '\n\n' : '') + notes.join('\n');
      }
      if (!userContent) userContent = '[photos attached]';

      state.messages.push({ role: 'user', content: userContent });
      const reply = await groqChat(state.messages);
      state.messages.push({ role: 'assistant', content: reply });
      setTyping(false);
      addMessage('bot', reply);
    } catch (e){
      setTyping(false);
      addMessage('bot', `Something went wrong talking to the assistant: ${e.message}`);
    }
    setBusy(false);
  }

  sendBtn.onclick = sendTurn;
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendTurn(); }
  });

  commitBtn.onclick = async () => {
    if (!canCommit() || state.busy) return;
    setBusy(true);
    addNote('Compiling the menu…');
    try {
      const extraction = await groqChat([
        { role: 'system', content: `Based on the full conversation, output ONLY a single JSON object
(no markdown fences, no commentary) with this exact shape:
{"restaurantName": string, "tagline": string, "sections": [{"title": string, "items": [{"name": string, "description": string, "price": string}]}]}
Use "" for any field you don't have. Include every item that was discussed.` },
        ...state.messages.filter(m => m.role !== 'system'),
      ], { jsonOnly: true });

      let cleaned = extraction.trim().replace(/^```(json)?/i, '').replace(/```$/,'').trim();
      let menuData;
      try { menuData = JSON.parse(cleaned); }
      catch { throw new Error('The assistant\'s summary wasn\'t valid JSON — try describing the menu a bit more, then commit again.'); }

      const allItems = (menuData.sections || []).flatMap(s => s.items || []);

      // Match uploaded dish photos to items by name (best-effort substring
      // match either direction). Each photo is used at most once.
      const photoPool = state.dishPhotos.slice();
      allItems.forEach(item => {
        const itemKey = normalizeForMatch(item.name);
        if (!itemKey) return;
        const idx = photoPool.findIndex(p => {
          const dishKey = normalizeForMatch(p.dishName);
          return dishKey && (itemKey.includes(dishKey) || dishKey.includes(itemKey));
        });
        if (idx !== -1){
          item.image = photoPool[idx].dataUrl;
          photoPool.splice(idx, 1);
        }
      });

      // Anything still without a photo, look one up online — best-effort,
      // fine if it comes back empty for an item.
      const stillMissing = allItems.filter(item => !item.image && item.name);
      if (stillMissing.length){
        addNote(stillMissing.length === 1
          ? 'Looking up a photo for one item…'
          : `Looking up photos for ${stillMissing.length} items…`);
        await Promise.all(stillMissing.map(async item => {
          const found = await findStockImage(item.name);
          if (found) item.image = found;
        }));
      }

      menuData.updatedAt = new Date().toISOString();

      addNote('Publishing to GitHub…');
      const result = await gh.putFile(state.slug, menuData, state.sha, `${state.sha ? 'Update' : 'Create'} menu: ${state.slug}`);
      state.sha = result.content.sha;
      addNote('Published.');
      addMessage('bot', `Done — your menu is live at:`);
      addQrBlock(state.slug);
      setBusy(false);
    } catch (e){
      addMessage('bot', `Couldn't publish: ${e.message}`);
      setBusy(false);
    }
  };

  // kick off
  if (editSlug){
    textarea.value = editSlug;
    sendTurn();
  } else {
    addMessage('bot', "Hi! What customer name should this menu be published under? (This becomes the page's web address.)");
  }
}

boot();
</script>
</body>
</html>
