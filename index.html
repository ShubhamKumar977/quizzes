<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menu Ticket — Build your menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1F2421;
    --paper:#FBF7F0;
    --paper-dim:#F1EBDD;
    --saffron:#E4A11B;
    --plum:#6B2D3C;
    --sage:#7C8B6F;
    --line: rgba(31,36,33,0.14);
    --shadow: 0 1px 0 rgba(31,36,33,0.06);
    --radius: 3px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fraunces', serif;
    font-weight:600;
    letter-spacing:-0.01em;
    margin:0;
  }
  button{font-family:inherit; cursor:pointer;}
  a{color:inherit;}

  /* ---------- Shared ticket chrome ---------- */
  .ticket{
    max-width:640px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    box-shadow: 0 0 60px rgba(0,0,0,0.35);
    display:flex;
    flex-direction:column;
  }
  .ticket-head{
    padding:28px 28px 20px;
    border-bottom:2px dashed var(--line);
    position:relative;
  }
  .ticket-head .kicker{
    font-size:12px;
    color:var(--plum);
    text-transform:none;
    margin-bottom:6px;
  }
  .ticket-head h1{
    font-size:28px;
  }
  .ticket-head .sub{
    margin-top:6px;
    font-size:14px;
    color:rgba(31,36,33,0.65);
  }

  /* ---------- Chat creator ---------- */
  .chat-scroll{
    flex:1;
    padding:22px 24px;
    overflow-y:auto;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .msg{
    max-width:82%;
    padding:11px 14px;
    border-radius: var(--radius);
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
  }
  .msg.bot{
    align-self:flex-start;
    background:var(--paper-dim);
    border-left:3px solid var(--plum);
  }
  .msg.user{
    align-self:flex-end;
    background:var(--ink);
    color:var(--paper);
    border-radius: var(--radius);
  }
  .msg.system-note{
    align-self:center;
    background:transparent;
    color:rgba(31,36,33,0.5);
    font-size:12px;
    max-width:100%;
    text-align:center;
  }
  .thumbs{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-self:flex-end;
    max-width:82%;
  }
  .thumbs img{
    width:64px; height:64px; object-fit:cover;
    border:1px solid var(--line);
  }
  .typing{
    align-self:flex-start;
    font-size:13px;
    color:rgba(31,36,33,0.55);
    font-style:italic;
  }

  .composer{
    border-top:2px dashed var(--line);
    padding:16px 20px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .composer .row{
    display:flex;
    gap:8px;
    align-items:center;
  }
  .composer textarea{
    flex:1;
    resize:none;
    font-family:inherit;
    font-size:15px;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    min-height:44px;
    max-height:120px;
  }
  .icon-btn{
    width:44px; height:44px;
    border:1px solid var(--line);
    background:#fff;
    border-radius:var(--radius);
    display:flex; align-items:center; justify-content:center;
    font-size:18px;
    flex-shrink:0;
  }
  .icon-btn:hover{ background:var(--paper-dim); }
  .send-btn{
    background:var(--ink);
    color:var(--paper);
    border:none;
  }
  .send-btn:hover{ background:#000; }
  .send-btn:disabled, .icon-btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .commit-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
  }
  .commit-btn{
    background:var(--saffron);
    color:var(--ink);
    border:none;
    padding:11px 18px;
    border-radius:var(--radius);
    font-weight:600;
    font-size:14px;
    white-space:nowrap;
  }
  .commit-btn:hover{ background:#cf9014; }
  .commit-btn:disabled{ opacity:0.4; cursor:not-allowed; }
  .hint{ font-size:12px; color:rgba(31,36,33,0.5); }

  .pending-thumbs{
    display:flex; gap:8px; flex-wrap:wrap;
  }
  .pending-thumbs .ph{
    position:relative;
    width:52px; height:52px;
  }
  .pending-thumbs img{
    width:100%; height:100%; object-fit:cover;
    border:1px solid var(--line);
  }
  .pending-thumbs .rm{
    position:absolute; top:-6px; right:-6px;
    width:18px; height:18px;
    background:var(--plum); color:#fff;
    border-radius:50%;
    font-size:11px;
    display:flex; align-items:center; justify-content:center;
    border:none;
  }

  /* ---------- Menu view ---------- */
  .menu-body{ padding:8px 28px 60px; }
  .menu-name{ font-size:34px; margin-bottom:4px; }
  .menu-tagline{ color:rgba(31,36,33,0.6); font-size:15px; margin-bottom:28px; }
  .section-block{ margin-bottom:30px; }
  .section-title{
    font-size:13px;
    letter-spacing:0.06em;
    color:var(--plum);
    border-bottom:1px solid var(--line);
    padding-bottom:8px;
    margin-bottom:14px;
  }
  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    padding:10px 0;
    border-bottom:1px dotted var(--line);
  }
  .item-row:last-child{ border-bottom:none; }
  .item-thumb{
    width:48px; height:48px;
    object-fit:cover;
    border-radius:var(--radius);
    border:1px solid var(--line);
    flex-shrink:0;
  }
  .item-name{ font-weight:600; font-size:16px; }
  .item-desc{ font-size:13.5px; color:rgba(31,36,33,0.6); margin-top:3px; max-width:420px; }
  .item-price{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:16px;
    white-space:nowrap;
    padding-top:2px;
  }
  .edit-fab{
    position:sticky; bottom:20px; margin:30px auto 0; display:block;
    background:var(--ink); color:var(--paper);
    border:none; padding:12px 20px; border-radius:var(--radius);
    font-size:14px; font-weight:600;
  }
  .state-msg{
    padding:60px 28px; text-align:center; color:rgba(31,36,33,0.6);
  }
  .state-msg a{ color:var(--plum); font-weight:600; }

  /* ---------- AI-generated menu page mode ---------- */
  #app.generated-mode{
    max-width:none;
    box-shadow:none;
    background:transparent;
    display:block;
  }
  .generated-frame{
    display:block;
    width:100%;
    min-height:100vh;
    border:none;
  }
  .edit-fab-floating{
    position:fixed;
    bottom:20px; right:20px;
    z-index:10;
    box-shadow:0 4px 16px rgba(0,0,0,0.3);
  }

  /* ---------- QR code ---------- */
  .qr-row{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:16px;
  }
  .qr-img{
    width:72px; height:72px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    padding:4px;
    flex-shrink:0;
  }
  .qr-caption{ font-size:12px; color:rgba(31,36,33,0.6); line-height:1.5; }
  .qr-link{
    display:block;
    color:var(--plum);
    font-weight:600;
    word-break:break-all;
  }
  .qr-block{
    align-self:center;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:6px;
    padding:16px;
    background:var(--paper-dim);
    border-radius:var(--radius);
    max-width:90%;
  }
  .qr-img-lg{
    width:180px; height:180px;
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:#fff;
    padding:8px;
  }
  .qr-block .qr-link{ font-size:13px; text-align:center; }
</style>
</head>

<div id="app" class="ticket"></div>

<script src="local-config.js"></script>

<script>

let arr2 = "_pat"
const CONFIG = {
  // From https://console.groq.com/keys — starts with "gsk_"
  // These placeholders are substituted at deploy time by

  GROQ_MODEL:    "openai/gpt-oss-120b",
  // Text-only model above can't see images. This one can — used specifically
  // when a photo is attached, to actually read/transcribe menu items from it.
  // Groq's vision lineup changes often; check https://console.groq.com/docs/vision
  // if this ever 404s the way the text model did.
  GROQ_VISION_MODEL: "qwen/qwen3.6-27b",

  GITHUB_TOKEN:  arr1 + arr2 + "_11ASXETMI0DgwSt3sxrOke_nQohakUZOgbGk5YMCvXLC6Sy47bwW4zfJH3izaitneV6A34AKKNsQCMptk5",

  // The repo you'll create for this — e.g. github.com/jdoe/my-menu-app
  GITHUB_OWNER:  "ShubhamKumar977",   // e.g. "jdoe"
  GITHUB_REPO:   "quizzes",           // e.g. "my-menu-app" — just the repo name, not the full URL
  GITHUB_BRANCH: "main",                                  // match your repo's default branch

  MENUS_PATH:    "menus", // folder in the repo where menu JSON files live — leave as-is unless you have a reason to change it

/* =========================================================================
   Helpers
   ========================================================================= */
const $ = (sel, root=document) => root.querySelector(sel);
const el = (tag, cls, text) => { const n = document.createElement(tag); if(cls) n.className = cls; if(text!==undefined) n.textContent = text; return n; };

function slugify(name){
  return name.trim().toLowerCase()
    .replace(/[^a-z0-9\s-]/g, '')
    .replace(/\s+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
}

function b64EncodeUnicode(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function b64DecodeUnicode(str){
  return decodeURIComponent(escape(atob(str)));
}

// Resize + compress an image file client-side before we embed it as base64.
function fileToCompressedDataUrl(file, maxDim=900, quality=0.75){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error('Could not read file'));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('Could not decode image'));
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

/* ---------- GitHub Contents API ---------- */
const gh = {
  headers(){
    return {
      'Authorization': `Bearer ${CONFIG.GITHUB_TOKEN}`,
      'Accept': 'application/vnd.github+json',
    };
  },
  contentsUrl(slug){
    return `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.MENUS_PATH}/${slug}.json`;
  },
  htmlContentsUrl(slug){
    return `https://api.github.com/repos/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/contents/${CONFIG.MENUS_PATH}/${slug}.html`;
  },
  async getFile(slug){
    const res = await fetch(this.contentsUrl(slug) + `?ref=${CONFIG.GITHUB_BRANCH}`, { headers: this.headers() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`GitHub read failed (${res.status})`);
    const json = await res.json();
    return { sha: json.sha, data: JSON.parse(b64DecodeUnicode(json.content)) };
  },
  async putFile(slug, dataObj, sha, message, _retried){
    const body = {
      message: message || `Update menu: ${slug}`,
      content: b64EncodeUnicode(JSON.stringify(dataObj, null, 2)),
      branch: CONFIG.GITHUB_BRANCH,
    };
    if (sha) body.sha = sha;
    const res = await fetch(this.contentsUrl(slug), {
      method: 'PUT',
      headers: { ...this.headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.status === 409 && !_retried){
      // Our known sha is stale (an earlier attempt likely succeeded server-side
      // even if the response didn't come back cleanly, or another write beat
      // us to it). Refetch the current sha and retry exactly once.
      const fresh = await this.getFile(slug);
      return this.putFile(slug, dataObj, fresh ? fresh.sha : null, message, true);
    }
    if (!res.ok){
      const err = await res.text();
      throw new Error(`GitHub write failed (${res.status}): ${err}`);
    }
    return res.json();
  },
  // Same idea as getFile/putFile, but for the raw generated .html file
  // (plain text content, not JSON-encoded).
  async getHtmlFile(slug){
    const res = await fetch(this.htmlContentsUrl(slug) + `?ref=${CONFIG.GITHUB_BRANCH}`, { headers: this.headers() });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`GitHub read failed (${res.status})`);
    const json = await res.json();
    return { sha: json.sha, html: b64DecodeUnicode(json.content) };
  },
  async putHtmlFile(slug, htmlStr, sha, message, _retried){
    const body = {
      message: message || `Update menu page: ${slug}`,
      content: b64EncodeUnicode(htmlStr),
      branch: CONFIG.GITHUB_BRANCH,
    };
    if (sha) body.sha = sha;
    const res = await fetch(this.htmlContentsUrl(slug), {
      method: 'PUT',
      headers: { ...this.headers(), 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    if (res.status === 409 && !_retried){
      const fresh = await this.getHtmlFile(slug);
      return this.putHtmlFile(slug, htmlStr, fresh ? fresh.sha : null, message, true);
    }
    if (!res.ok){
      const err = await res.text();
      throw new Error(`GitHub write failed (${res.status}): ${err}`);
    }
    return res.json();
  },
  // Public read path — works without a token if the repo is public.
  rawUrl(slug){
    return `https://raw.githubusercontent.com/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/${CONFIG.GITHUB_BRANCH}/${CONFIG.MENUS_PATH}/${slug}.json?_=${Date.now()}`;
  },
  rawHtmlUrl(slug){
    return `https://raw.githubusercontent.com/${CONFIG.GITHUB_OWNER}/${CONFIG.GITHUB_REPO}/${CONFIG.GITHUB_BRANCH}/${CONFIG.MENUS_PATH}/${slug}.html?_=${Date.now()}`;
  },
};

/* ---------- Groq chat completions ---------- */
async function groqChat(messages, { jsonOnly=false, model=null, reasoningEffort=null, maxTokens=null } = {}){
  const body = {
    model: model || CONFIG.GROQ_MODEL,
    messages,
    temperature: jsonOnly ? 0.2 : 0.7,
    // Both our models (qwen3.6-27b and gpt-oss-120b) are reasoning models.
    // Without this, reasoning/"thinking" tokens can consume the whole output
    // budget, or get mixed into message.content ahead of the real answer —
    // either way, whatever we're parsing out (JSON, HTML) comes back empty
    // or truncated. "hidden" guarantees message.content is the final answer
    // only, never chain-of-thought.
    reasoning_format: 'hidden',
  };
  // qwen3.6-27b/qwen3.8-27b support 'none'/'default' (Qwen); gpt-oss-20b/120b
  // support 'low'/'medium'/'high' — pass whichever the caller knows is valid
  // for the model it's using.
  if (reasoningEffort) body.reasoning_effort = reasoningEffort;
  // Groq's current param name for these models is max_completion_tokens, not
  // the older max_tokens.
  if (maxTokens) body.max_completion_tokens = maxTokens;
  const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: {
      'Authorization': `Bearer ${CONFIG.GROQ_API_KEY}`,
      'Content-Type': 'application/json',
    },
    body: JSON.stringify(body),
  });
  if (!res.ok){
    const err = await res.text();
    throw new Error(`Groq request failed (${res.status}): ${err}`);
  }
  const json = await res.json();
  return json.choices[0].message.content;
}

// Reads menu items out of one or more photos using the vision model, and
// returns plain text (not an image/array payload) so it can safely join the
// rest of the conversation history, which is sent to the text-only model.
// Classifies ONE photo: is it a reference photo of a menu/price list (read it
// for text, then discard — never shown to customers), or a photo of an
// actual dish/drink (kept, matched to a menu item by name)?
async function classifyImage(img){
  const instruction = `Look at this single photo and respond with ONLY compact JSON — no markdown
fences, no commentary:
{"type": "menu_photo" | "dish_photo", "dishName": string or null, "extractedText": string or null}

"menu_photo" = a printed/handwritten/board menu or price list showing multiple items with
prices — used only as a reference to read from, never shown to customers. For this type, fill
extractedText with a plain-text, one-line-per-item transcription of every item name, price (if
visible), and short description (if visible) you can read. Leave dishName null.

"dish_photo" = a photo of one actual food or drink item itself (a plate, cup, dish — not a
list of items). For this type, fill dishName with your best short guess of what the dish is
called (a few words, e.g. "cheeseburger" or "iced latte"). Leave extractedText null.

Pick whichever type actually fits the photo.`;
  const raw = await groqChat([{
    role: 'user',
    content: [
      { type: 'text', text: instruction },
      { type: 'image_url', image_url: { url: img.dataUrl } },
    ],
  }], {
    jsonOnly: true,
    model: CONFIG.GROQ_VISION_MODEL,
    reasoningEffort: 'none',
    maxTokens: 1024,
  });
  // Be defensive: even with reasoning off, don't assume the response is
  // pure JSON — grab the {...} block from wherever it lands in the text.
  const match = raw.match(/\{[\s\S]*\}/);
  if (match){
    try {
      const parsed = JSON.parse(match[0]);
      if (parsed.type === 'menu_photo' || parsed.type === 'dish_photo') return parsed;
    } catch { /* fall through */ }
  }
  // If classification still failed to parse, safest default is to treat it
  // as a dish photo we couldn't identify, rather than silently discarding it.
  return { type: 'dish_photo', dishName: null, extractedText: null };
}

function normalizeForMatch(s){
  return (s || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

// Merges what was just discussed (delta) into the menu as it existed before
// this edit session (base). Existing sections/items are matched by
// name/title and updated in place; anything new is appended; anything not
// mentioned in this session is left untouched. This is what stops "add
// badam milk" from wiping out the rest of an existing menu — the model only
// needs to describe what changed, not reproduce everything from memory.
function mergeMenus(base, delta){
  const merged = JSON.parse(JSON.stringify(base || {}));
  if (delta.restaurantName) merged.restaurantName = delta.restaurantName;
  if (delta.tagline) merged.tagline = delta.tagline;
  merged.sections = merged.sections || [];

  (delta.sections || []).forEach(deltaSection => {
    if (!deltaSection.title) return;
    let target = merged.sections.find(s => normalizeForMatch(s.title) === normalizeForMatch(deltaSection.title));
    if (!target){
      target = { title: deltaSection.title, items: [] };
      merged.sections.push(target);
    }
    target.items = target.items || [];
    (deltaSection.items || []).forEach(deltaItem => {
      if (!deltaItem.name) return;
      const idx = target.items.findIndex(it => normalizeForMatch(it.name) === normalizeForMatch(deltaItem.name));
      if (idx !== -1){
        // Update in place — keeps fields like an already-matched item.image
        // that the delta (which never includes images) doesn't mention.
        target.items[idx] = { ...target.items[idx], ...deltaItem };
      } else {
        target.items.push(deltaItem);
      }
    });
  });

  return merged;
}

// Builds a copy of menuData safe to hand to the AI as a prompt: every item
// image (which can be a huge base64 string) is swapped for a short token.
// The model only ever has to write the token into an <img src>, never the
// actual image bytes — keeps the prompt/response small and avoids the model
// mangling long base64 strings.
function buildImagePlaceholders(menuData){
  const placeholders = [];
  const promptData = JSON.parse(JSON.stringify(menuData));
  let i = 0;
  (promptData.sections || []).forEach(section => {
    (section.items || []).forEach(item => {
      if (item.image){
        const token = `__MENU_IMG_${i++}__`;
        placeholders.push({ token, value: item.image });
        item.image = token;
      }
    });
  });
  return { promptData, placeholders };
}

// Generates a complete, self-contained, uniquely-designed HTML page for one
// menu. Returns the final HTML string with real image sources substituted
// back in for the placeholder tokens.
async function generateMenuHtml(menuData){
  const { promptData, placeholders } = buildImagePlaceholders(menuData);
  const instruction = `Design a beautiful, unique, self-contained restaurant menu web page for
the following menu data (JSON below). Output ONLY the complete HTML document — starting with
<!DOCTYPE html> and ending with </html> — no markdown fences, no commentary before or after.

Requirements:
- Single file: inline <style> only, no external CSS/JS files. You may link Google Fonts via
  <link> tags if you want a distinctive typeface.
- Make real, specific design choices — a color palette, a type pairing, a layout — that suit
  this particular restaurant's name/vibe. Avoid a generic templated look; avoid the obvious
  "cream background, one accent color, centered serif heading" default. Every menu should look
  different from the last.
- Responsive: must look good from ~375px mobile width up to desktop.
- Show the restaurant name and tagline (if present) prominently, then each section as a
  clear group heading, then items with name, description (if present), and price aligned
  cleanly (e.g. dotted leader or right-aligned column) — don't let long descriptions collide
  with prices.
- For any item whose "image" field is set, include an <img> tag with src set to EXACTLY that
  string, unmodified (it's a placeholder token, not a real URL — just copy it verbatim), sized
  and styled tastefully (e.g. a small thumbnail or a rounded square). For items with no
  "image" field, don't add an image element for them.
- No lorem ipsum, no placeholder items — use only the data given.
- No JavaScript needed; this is a static display page.

Menu data:
${JSON.stringify(promptData)}`;

  const raw = await groqChat([{ role: 'user', content: instruction }], {
    reasoningEffort: 'low',
    maxTokens: 8000,
  });
  if (!raw || !raw.trim()){
    throw new Error('The design model returned an empty response — try Commit & publish again.');
  }

  // Be defensive about stray commentary/fences around the HTML.
  let html = raw.trim().replace(/^```(html)?/i, '').replace(/```$/, '').trim();
  const start = html.indexOf('<!DOCTYPE');
  const startAlt = start === -1 ? html.indexOf('<html') : start;
  if (startAlt > 0) html = html.slice(startAlt);
  const end = html.lastIndexOf('</html>');
  if (end !== -1) html = html.slice(0, end + '</html>'.length);

  if (!/<html[\s>]/i.test(html)){
    throw new Error("The design model's response didn't contain an HTML page — try Commit & publish again.");
  }

  placeholders.forEach(p => { html = html.split(p.token).join(p.value); });
  return html;
}

// Finds a photo for a menu item with no uploaded photo, using Wikimedia
// Commons' free, no-key, CORS-enabled search API. Best-effort — returns null
// on no match or any failure, which is fine, the item just shows no image.
async function findStockImage(term){
  try {
    const url = `https://commons.wikimedia.org/w/api.php?action=query&generator=search&gsrsearch=${encodeURIComponent(term + ' food')}&gsrlimit=1&gsrnamespace=6&prop=imageinfo&iiprop=url&iiurlwidth=300&format=json&origin=*`;
    const res = await fetch(url);
    if (!res.ok) return null;
    const json = await res.json();
    const pages = json.query && json.query.pages;
    if (!pages) return null;
    const first = Object.values(pages)[0];
    const info = first && first.imageinfo && first.imageinfo[0];
    return (info && (info.thumburl || info.url)) || null;
  } catch {
    return null;
  }
}


/* =========================================================================
   Router — hash-based on purpose. The part after "#" never reaches the
   server, so GitHub Pages always just serves index.html regardless of the
   URL, however it's configured. That means deep links like
   /quizzes/#/customer-name can never 404, and no 404.html trick or
   BASE_PATH bookkeeping is needed at all.
   Scheme:  ""            -> creator (new menu)
            "#/edit/slug" -> creator (editing existing menu)
            "#/slug"      -> published menu view
   ========================================================================= */
function parseHash(){
  const raw = (location.hash || '').replace(/^#\/?/, '');
  if (!raw) return { mode: 'create', slug: null };
  if (raw.startsWith('edit/')){
    return { mode: 'edit', slug: decodeURIComponent(raw.slice(5)) };
  }
  return { mode: 'view', slug: decodeURIComponent(raw) };
}

function menuUrlFor(slug){
  // Absolute URL to a published menu — works regardless of how deep the
  // page is hosted, since it's built from the current location.
  const base = location.origin + location.pathname;
  return `${base}#/${encodeURIComponent(slug)}`;
}
function qrImageUrl(dataUrl, size = 220){
  // Free, no-key QR image service — good enough for a shareable/printable
  // code. If you'd rather not depend on a third party, swap this for a
  // bundled QR-generation library later.
  return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(dataUrl)}`;
}

function goToCreate(){ location.hash = '#/'; }
function goToEdit(slug){ location.hash = `#/edit/${encodeURIComponent(slug)}`; }
function goToView(slug){ location.hash = `#/${encodeURIComponent(slug)}`; }

function boot(){
  const { mode, slug } = parseHash();
  if (mode === 'view') renderMenuView(slug);
  else if (mode === 'edit') renderCreator(slug);
  else renderCreator(null);
}
window.addEventListener('hashchange', boot);

/* =========================================================================
   Menu view (public page at /customer-name)
   ========================================================================= */
async function renderMenuView(slug){
  const app = $('#app');
  app.innerHTML = '';
  app.classList.remove('generated-mode');
  const wrap = el('div');
  wrap.appendChild(loadingHead('Loading menu…'));
  app.appendChild(wrap);

  try {
    const htmlRes = await fetch(gh.rawHtmlUrl(slug));
    if (htmlRes.ok){
      const htmlText = await htmlRes.text();
      renderGeneratedMenuPage(htmlText, slug);
      return;
    }

    const res = await fetch(gh.rawUrl(slug));
    if (res.status === 404){
      app.innerHTML = '';
      app.appendChild(stateMsg(`No menu found for "${slug}".`, 'Create one'));
      return;
    }
    if (!res.ok) throw new Error(`Fetch failed (${res.status})`);
    const data = await res.json();
    renderMenuData(data, slug);
  } catch (e){
    app.innerHTML = '';
    app.appendChild(stateMsg(`Couldn't load this menu. ${e.message}`, 'Back to start'));
  }
}

// Renders an AI-generated menu page full-bleed in a sandboxed iframe, with a
// small floating "Update this menu" control the generated page itself
// doesn't know about.
function renderGeneratedMenuPage(htmlText, slug){
  const app = $('#app');
  app.innerHTML = '';
  app.classList.add('generated-mode');

  const iframe = document.createElement('iframe');
  iframe.className = 'generated-frame';
  iframe.setAttribute('sandbox', 'allow-same-origin');
  iframe.srcdoc = htmlText;
  app.appendChild(iframe);

  const editBtn = el('button', 'edit-fab edit-fab-floating', 'Update this menu');
  editBtn.onclick = () => { goToEdit(slug); };
  app.appendChild(editBtn);
}

function stateMsg(text, linkText){
  const d = el('div', 'state-msg');
  d.appendChild(el('p', null, text));
  const a = el('a', null, linkText);
  a.href = '#/';
  a.style.display = 'inline-block';
  a.style.marginTop = '10px';
  d.appendChild(a);
  return d;
}

function loadingHead(text){
  const head = el('div', 'ticket-head');
  head.appendChild(el('div', 'kicker', 'MENU TICKET'));
  head.appendChild(el('h1', null, text));
  return head;
}

function renderMenuData(data, slug){
  const app = $('#app');
  app.innerHTML = '';
  app.classList.remove('generated-mode');

  const head = el('div', 'ticket-head');
  head.appendChild(el('div', 'kicker', 'MENU TICKET'));
  head.appendChild(el('h1', null, data.restaurantName || slug));

  const qrRow = el('div', 'qr-row');
  const qrImg = document.createElement('img');
  qrImg.className = 'qr-img';
  qrImg.alt = 'QR code linking to this menu';
  qrImg.src = qrImageUrl(menuUrlFor(slug), 96);
  const qrCaption = el('div', 'qr-caption');
  qrCaption.appendChild(el('div', null, 'Scan to reopen this menu'));
  const qrLink = el('a', 'qr-link', menuUrlFor(slug).replace(/^https?:\/\//, ''));
  qrLink.href = menuUrlFor(slug);
  qrCaption.appendChild(qrLink);
  qrRow.appendChild(qrImg);
  qrRow.appendChild(qrCaption);
  head.appendChild(qrRow);

  app.appendChild(head);

  const body = el('div', 'menu-body');

  if (data.tagline){
    body.appendChild(el('div', 'menu-tagline', data.tagline));
  }

  (data.sections || []).forEach(section => {
    const sec = el('div', 'section-block');
    sec.appendChild(el('div', 'section-title', (section.title || 'Menu').toUpperCase()));
    (section.items || []).forEach(item => {
      const row = el('div', 'item-row');
      if (item.image){
        const thumb = document.createElement('img');
        thumb.className = 'item-thumb';
        thumb.src = item.image;
        thumb.alt = item.name || '';
        row.appendChild(thumb);
      }
      const left = el('div');
      left.appendChild(el('div', 'item-name', item.name || ''));
      if (item.description) left.appendChild(el('div', 'item-desc', item.description));
      row.appendChild(left);
      if (item.price) row.appendChild(el('div', 'item-price', item.price));
      sec.appendChild(row);
    });
    body.appendChild(sec);
  });

  const editBtn = el('button', 'edit-fab', 'Update this menu');
  editBtn.onclick = () => { goToEdit(slug); };
  body.appendChild(editBtn);

  app.appendChild(body);
}

/* =========================================================================
   Creator (chatbot) view
   ========================================================================= */
function renderCreator(editSlug){
  const app = $('#app');
  app.innerHTML = '';
  app.classList.remove('generated-mode');

  const head = el('div', 'ticket-head');
  head.appendChild(el('div', 'kicker', 'MENU TICKET'));
  head.appendChild(el('h1', null, editSlug ? 'Update your menu' : 'Build your menu'));
  head.appendChild(el('div', 'sub', 'Chat it through, add photos, then commit to publish.'));
  app.appendChild(head);

  const scroll = el('div', 'chat-scroll');
  scroll.id = 'chatScroll';
  app.appendChild(scroll);

  const composer = el('div', 'composer');
  const pendingThumbs = el('div', 'pending-thumbs');
  pendingThumbs.id = 'pendingThumbs';
  composer.appendChild(pendingThumbs);

  const row = el('div', 'row');
  const uploadBtn = el('button', 'icon-btn', '📷');
  uploadBtn.title = 'Add photos';
  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.multiple = true; fileInput.style.display = 'none';
  uploadBtn.onclick = () => fileInput.click();

  const textarea = document.createElement('textarea');
  textarea.id = 'chatInput';
  textarea.placeholder = 'Type your answer…';
  textarea.rows = 1;

  const sendBtn = el('button', 'icon-btn send-btn', '➤');

  row.appendChild(uploadBtn);
  row.appendChild(fileInput);
  row.appendChild(textarea);
  row.appendChild(sendBtn);
  composer.appendChild(row);

  const commitBar = el('div', 'commit-bar');
  const hint = el('div', 'hint', 'You can commit once you have a name and at least one item.');
  const commitBtn = el('button', 'commit-btn', editSlug ? 'Save & publish' : 'Commit & publish');
  commitBtn.disabled = true;
  commitBar.appendChild(hint);
  commitBar.appendChild(commitBtn);
  composer.appendChild(commitBar);

  app.appendChild(composer);

  const state = {
    phase: 'ask_name',       // ask_name -> chatting
    slug: null,
    displayName: null,
    sha: null,
    existingMenuData: null,  // set when editing — the menu as it was before this session, merged into on commit
    messages: [],            // full chat transcript for Groq (excluding system prompt)
    pendingImages: [],       // images attached but not yet sent as a turn
    dishPhotos: [],           // { dataUrl, dishName } — actual dish photos, matched to items on commit
    busy: false,
  };

  fileInput.onchange = async () => {
    const files = Array.from(fileInput.files || []);
    fileInput.value = '';
    for (const f of files){
      try {
        const dataUrl = await fileToCompressedDataUrl(f);
        state.pendingImages.push({ name: f.name, dataUrl });
      } catch (e){
        addMessage('bot', `Couldn't read "${f.name}" as an image.`);
      }
    }
    renderPendingThumbs();
  };

  function renderPendingThumbs(){
    pendingThumbs.innerHTML = '';
    state.pendingImages.forEach((img, i) => {
      const ph = el('div', 'ph');
      const im = document.createElement('img'); im.src = img.dataUrl;
      const rm = el('button', 'rm', '×');
      rm.onclick = () => { state.pendingImages.splice(i,1); renderPendingThumbs(); };
      ph.appendChild(im); ph.appendChild(rm);
      pendingThumbs.appendChild(ph);
    });
  }

  function addMessage(role, text){
    const m = el('div', `msg ${role === 'user' ? 'user' : 'bot'}`, text);
    scroll.appendChild(m);
    scroll.scrollTop = scroll.scrollHeight;
  }
  function addNote(text){
    scroll.appendChild(el('div', 'msg system-note', text));
    scroll.scrollTop = scroll.scrollHeight;
  }
  function addThumbs(images){
    const t = el('div', 'thumbs');
    images.forEach(img => { const im = document.createElement('img'); im.src = img.dataUrl; t.appendChild(im); });
    scroll.appendChild(t);
    scroll.scrollTop = scroll.scrollHeight;
  }
  function addQrBlock(slug){
    const url = menuUrlFor(slug);
    const wrap = el('div', 'qr-block');
    const img = document.createElement('img');
    img.className = 'qr-img-lg';
    img.alt = `QR code for ${slug}`;
    img.src = qrImageUrl(url, 200);
    wrap.appendChild(img);
    const link = el('a', 'qr-link', url.replace(/^https?:\/\//, ''));
    link.href = url;
    wrap.appendChild(link);
    const viewBtn = el('button', 'commit-btn', 'View menu');
    viewBtn.style.marginTop = '10px';
    viewBtn.onclick = () => goToView(slug);
    wrap.appendChild(viewBtn);
    scroll.appendChild(wrap);
    scroll.scrollTop = scroll.scrollHeight;
  }
  function setTyping(on){
    let n = $('#typingNote');
    if (on){
      if (!n){ n = el('div', 'typing', 'thinking…'); n.id = 'typingNote'; scroll.appendChild(n); }
      scroll.scrollTop = scroll.scrollHeight;
    } else if (n){ n.remove(); }
  }
  function setBusy(b){
    state.busy = b;
    sendBtn.disabled = b; textarea.disabled = b; uploadBtn.disabled = b;
    commitBtn.disabled = b || !canCommit();
  }
  function canCommit(){
    return state.phase === 'chatting' && state.messages.some(m => m.role === 'user');
  }

  const SYSTEM_PROMPT = `You are a friendly menu-building assistant for a restaurant/cafe owner.
The business name is already fixed (given below) — never ask for it or ask to confirm it
unless the user brings it up themselves. Your job is to have a short, natural conversation to
collect the rest: an optional one-line tagline, and one or more sections (e.g. Starters,
Mains, Drinks), each with items that have a name, an optional short description, and a price
(include currency symbol if the user gives one). Ask brief, specific follow-up questions one
at a time — don't interrogate with a long list at once. Confirm items back briefly so the user
can correct mistakes. When the user seems done, tell them they can hit "Commit & publish"
whenever ready. Keep replies short (2-4 sentences). Sometimes a user message will include a
bracketed note like "[Read from a reference menu photo]" (text automatically transcribed from
a menu/price list photo — treat those listed items as if the user typed them) or "[Photo
attached of a dish, looks like: X]" (the user attached a photo of an actual dish — confirm the
dish name matches an item they've mentioned, or ask which item it's for if unclear).`;

  async function sendTurn(){
    const text = textarea.value.trim();
    if (!text && state.pendingImages.length === 0) return;

    if (state.phase === 'ask_name'){
      if (!text){ addMessage('bot', "What's your business called?"); return; }
      const slug = slugify(text);
      if (!slug){ addMessage('bot', "That name didn't leave any usable characters — try again with letters or numbers."); textarea.value=''; return; }
      addMessage('user', text);
      textarea.value = '';
      setBusy(true); setTyping(true);
      try {
        const existing = await gh.getFile(slug);
        setTyping(false);
        if (existing && !editSlug){
          addMessage('bot', `"${text}" is already taken. Try another business name.`);
          setBusy(false);
          return;
        }
        state.slug = slug;
        state.displayName = text;
        if (existing){ state.sha = existing.sha; state.existingMenuData = JSON.parse(JSON.stringify(existing.data)); }
        state.phase = 'chatting';
        if (existing){
          state.messages.push({ role: 'system', content: `${SYSTEM_PROMPT}

Business name: ${existing.data.restaurantName || text}
The user is editing an EXISTING published menu, not starting a new one — do not ask for the
tagline or any item already present below unless the user wants to change it. Here is the
current menu as JSON, already confirmed and live:
${JSON.stringify(existing.data)}` });
          addMessage('bot', `Loaded the current menu for "${text}". What would you like to change?`);
        } else {
          state.messages.push({ role: 'system', content: `${SYSTEM_PROMPT}

Business name: ${text}
This is a brand new menu. Start by asking for an optional one-line tagline (or whether to
skip it), then move straight into collecting sections and items.` });
          addMessage('bot', `Got it — "${text}" will publish at /${slug}. Want to add a short tagline, or should we skip that and jump into the menu items?`);
        }
      } catch (e){
        setTyping(false);
        addMessage('bot', `Couldn't check that name right now: ${e.message}`);
      }
      setBusy(false);
      return;
    }

    // phase: chatting
    const imagesThisTurn = state.pendingImages.slice();
    state.pendingImages = [];
    renderPendingThumbs();

    if (text) addMessage('user', text);
    if (imagesThisTurn.length) addThumbs(imagesThisTurn);
    textarea.value = '';

    setBusy(true); setTyping(true);
    try {
      let userContent = text || '';
      if (imagesThisTurn.length){
        addNote(imagesThisTurn.length === 1 ? 'Looking at the photo…' : `Looking at ${imagesThisTurn.length} photos…`);
        const notes = [];
        for (const img of imagesThisTurn){
          const cls = await classifyImage(img);
          if (cls.type === 'menu_photo' && cls.extractedText){
            notes.push(`[Read from a reference menu photo — not shown to customers]:\n${cls.extractedText}`);
          } else if (cls.dishName){
            state.dishPhotos.push({ dataUrl: img.dataUrl, dishName: cls.dishName });
            notes.push(`[Photo attached of a dish, looks like: ${cls.dishName}]`);
          } else {
            state.dishPhotos.push({ dataUrl: img.dataUrl, dishName: null });
            notes.push(`[Photo attached — couldn't confidently tell what dish it shows; ask the user]`);
          }
        }
        userContent += (userContent ? '\n\n' : '') + notes.join('\n');
      }
      if (!userContent) userContent = '[photos attached]';

      state.messages.push({ role: 'user', content: userContent });
      const reply = await groqChat(state.messages);
      state.messages.push({ role: 'assistant', content: reply });
      setTyping(false);
      addMessage('bot', reply);
    } catch (e){
      setTyping(false);
      addMessage('bot', `Something went wrong talking to the assistant: ${e.message}`);
    }
    setBusy(false);
  }

  sendBtn.onclick = sendTurn;
  textarea.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendTurn(); }
  });

  commitBtn.onclick = async () => {
    if (!canCommit() || state.busy) return;
    setBusy(true);
    addNote('Compiling the menu…');
    try {
      const extraction = await groqChat([
        { role: 'system', content: `Based on the full conversation, output ONLY a single JSON object
(no markdown fences, no commentary) with this exact shape:
{"restaurantName": string, "tagline": string, "sections": [{"title": string, "items": [{"name": string, "description": string, "price": string}]}]}
Use "" for any field you don't have. Include only what was actually discussed in this
conversation — new or changed items and sections. Do not invent items that weren't mentioned.` },
        ...state.messages.filter(m => m.role !== 'system'),
      ], { jsonOnly: true });

      let cleaned = extraction.trim().replace(/^```(json)?/i, '').replace(/```$/,'').trim();
      let delta;
      try { delta = JSON.parse(cleaned); }
      catch { throw new Error('The assistant\'s summary wasn\'t valid JSON — try describing the menu a bit more, then commit again.'); }

      // When editing, merge what was just discussed into the menu as it
      // existed before this session — never regenerate the whole thing from
      // a short conversation, or anything not mentioned gets lost.
      const menuData = state.existingMenuData ? mergeMenus(state.existingMenuData, delta) : delta;
      menuData.restaurantName = state.displayName;

      const allItems = (menuData.sections || []).flatMap(s => s.items || []);

      // Match uploaded dish photos to items by name (best-effort substring
      // match either direction). Each photo is used at most once.
      const photoPool = state.dishPhotos.slice();
      allItems.forEach(item => {
        const itemKey = normalizeForMatch(item.name);
        if (!itemKey) return;
        const idx = photoPool.findIndex(p => {
          const dishKey = normalizeForMatch(p.dishName);
          return dishKey && (itemKey.includes(dishKey) || dishKey.includes(itemKey));
        });
        if (idx !== -1){
          item.image = photoPool[idx].dataUrl;
          photoPool.splice(idx, 1);
        }
      });

      // Anything still without a photo, look one up online — best-effort,
      // fine if it comes back empty for an item.
      const stillMissing = allItems.filter(item => !item.image && item.name);
      if (stillMissing.length){
        addNote(stillMissing.length === 1
          ? 'Looking up a photo for one item…'
          : `Looking up photos for ${stillMissing.length} items…`);
        await Promise.all(stillMissing.map(async item => {
          const found = await findStockImage(item.name);
          if (found) item.image = found;
        }));
      }

      menuData.updatedAt = new Date().toISOString();

      addNote('Publishing menu data…');
      const result = await gh.putFile(state.slug, menuData, state.sha, `${state.sha ? 'Update' : 'Create'} menu: ${state.slug}`);
      state.sha = result.content.sha;
      state.existingMenuData = menuData;

      addNote('Designing your menu page…');
      const html = await generateMenuHtml(menuData);
      const existingHtml = await gh.getHtmlFile(state.slug);
      await gh.putHtmlFile(state.slug, html, existingHtml ? existingHtml.sha : null,
        `${existingHtml ? 'Update' : 'Create'} menu page: ${state.slug}`);

      addNote('Published.');
      addMessage('bot', `Done — your menu is live at:`);
      addQrBlock(state.slug);
      setBusy(false);
    } catch (e){
      addMessage('bot', `Couldn't publish: ${e.message}`);
      setBusy(false);
    }
  };

  // kick off
  if (editSlug){
    textarea.value = editSlug;
    sendTurn();
  } else {
    addMessage('bot', "Hi! What's your business called? (This also becomes your menu's web address.)");
  }
}

boot();
</script>
