<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>beauty – Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fdfdf7;
  --primary: #2a4d14;
  --accent: #c27d38;
  --muted: #7a7a6e;
  --radius: .5rem;
  --max-width: 960px;
  --font-heading: 'Playfair Display', serif;
  --font-body: 'Montserrat', sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:var(--bg);
  color:#333;
  line-height:1.6;
  padding:1rem;
  display:flex;
  justify-content:center;
}
.container{
  max-width:var(--max-width);
  width:100%;
}
header{
  text-align:center;
  padding:2rem 0 1rem;
}
h1{
  font-family:var(--font-heading);
  font-size:2.8rem;
  color:var(--primary);
  margin-bottom:.3rem;
}
h2{
  font-size:1.2rem;
  color:var(--muted);
}
section{
  margin-top:2rem;
}
section h3{
  font-family:var(--font-heading);
  font-size:1.6rem;
  color:var(--accent);
  border-bottom:2px solid var(--accent);
  padding-bottom:.3rem;
  margin-bottom:1rem;
}
.item{
  display:flex;
  flex-wrap:wrap;
  align-items:flex-start;
  margin-bottom:1.2rem;
}
.item img{
  width:80px;
  height:80px;
  object-fit:cover;
  border-radius:var(--radius);
  margin-right:1rem;
  flex-shrink:0;
}
.item .info{
  flex:1 1 0;
}
.item .info h4{
  font-weight:500;
  font-size:1.1rem;
  margin:0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.item .info h4 .price{
  font-family:var(--font-heading);
  color:var(--primary);
}
.item .info p{
  margin:.3rem 0 0;
  color:var(--muted);
  font-size:.95rem;
}
@media (max-width:600px){
  h1{font-size:2.2rem;}
  .item{flex-direction:column; align-items:center;}
  .item img{margin:0 0 .5rem;}
  .item .info h4{flex-direction:column; align-items:flex-start;}
  .item .info h4 .price{margin-top:.3rem;}
}
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>beauty</h1>
    <h2></h2>
  </header>
  <!-- No menu sections provided -->
  <p style="text-align:center;color:var(--muted);margin-top:2rem;">Menu will be updated soon.</p>
</div>
</body>
</html>
