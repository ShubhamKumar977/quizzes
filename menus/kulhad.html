<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kulhad Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8f0;
    --primary:#5d4037;
    --secondary:#8d6e63;
    --accent:#d7a96b;
    --text:#3e2723;
    --muted:#6d4c41;
  }
  body{
    margin:0;
    font-family:'Montserrat',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }
  .wrapper{
    max-width:960px;
    margin:0 auto;
    padding:1rem;
  }
  header{
    background:var(--primary);
    color:#fff;
    padding:2rem 1rem;
    text-align:center;
    border-radius:0 0 1rem 1rem;
  }
  header h1{
    font-family:'Playfair Display',serif;
    font-size:2.8rem;
    margin:0;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  header p{
    margin-top:.5rem;
    font-size:1rem;
    opacity:.9;
  }
  section{
    margin-top:2rem;
  }
  .section-title{
    font-family:'Playfair Display',serif;
    font-size:1.7rem;
    color:var(--secondary);
    border-bottom:2px solid var(--accent);
    padding-bottom:.3rem;
    margin-bottom:1rem;
  }
  .menu-item{
    display:flex;
    align-items:flex-start;
    gap:1rem;
    margin-bottom:1.5rem;
    flex-wrap:wrap;
  }
  .menu-item img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:.5rem;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    flex-shrink:0;
  }
  .item-details{
    flex:1;
    min-width:0;
  }
  .item-header{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .item-name{
    font-weight:600;
    color:var(--secondary);
    font-size:1.1rem;
    margin:0;
  }
  .price{
    font-family:'Montserrat',sans-serif;
    font-weight:600;
    color:var(--accent);
    white-space:nowrap;
    margin-left:.5rem;
  }
  .item-desc{
    margin-top:.3rem;
    color:var(--muted);
    font-size:.95rem;
  }
  @media(max-width:480px){
    header h1{font-size:2.2rem;}
    .section-title{font-size:1.5rem;}
    .menu-item{flex-direction:column;align-items:flex-start;}
    .menu-item img{width:80px;height:80px;}
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>kulhad</h1>
    <p></p>
  </header>

  <section>
    <h2 class="section-title">Desserts</h2>
    <div class="menu-item">
      <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Home_Ghewar_sweet.jpg/330px-Home_Ghewar_sweet.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="ghewar">
      <div class="item-details">
        <div class="item-header">
          <p class="item-name">ghewar</p>
          <span class="price">₹252</span>
        </div>
        <!-- No description provided -->
      </div>
    </div>
  </section>
</div>
</body>
</html>
