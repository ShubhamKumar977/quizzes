<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kulhad Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #faf4e6;
    --primary: #8b4513;
    --secondary: #d2691e;
    --accent: #cfa35e;
    --text: #3e2723;
    --muted: #5d4037;
  }
  body {
    margin:0;
    font-family: 'Montserrat', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
  }
  .container {
    max-width: 960px;
    margin: 0 auto;
    padding: 1rem;
  }
  header {
    text-align: center;
    padding: 2rem 0;
    background: var(--primary);
    color: #fff;
    border-radius: 0 0 1rem 1rem;
  }
  header h1 {
    font-family: 'Playfair Display', serif;
    font-size: 3rem;
    margin: 0;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  header p {
    margin-top: 0.5rem;
    font-size: 1.1rem;
    opacity: 0.85;
  }
  section {
    margin-top: 2rem;
  }
  .section-title {
    font-family: 'Playfair Display', serif;
    font-size: 1.8rem;
    color: var(--secondary);
    border-bottom: 2px solid var(--accent);
    padding-bottom: 0.3rem;
    margin-bottom: 1rem;
  }
  .item {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    margin-bottom: 1.5rem;
    gap: 1rem;
  }
  .item-img {
    flex: 0 0 80px;
    height: 80px;
    object-fit: cover;
    border-radius: 0.5rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
  }
  .item-info {
    flex: 1 1 0;
    min-width: 0;
  }
  .item-name {
    font-weight: 600;
    color: var(--secondary);
    font-size: 1.1rem;
    margin: 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .price {
    font-family: 'Montserrat', sans-serif;
    font-weight: 600;
    color: var(--accent);
    white-space: nowrap;
    margin-left: 0.5rem;
  }
  .item-description {
    margin-top: 0.3rem;
    color: var(--muted);
    font-size: 0.95rem;
  }
  @media (max-width: 480px) {
    header h1 {font-size: 2.2rem;}
    .section-title {font-size: 1.5rem;}
    .item {flex-direction: column; align-items: flex-start;}
    .item-img {width: 100%; height:auto;}
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>kulhad</h1>
  </header>

  <section>
    <h2 class="section-title">Desserts</h2>
    <div class="item">
      <img class="item-img" src="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Home_Ghewar_sweet.jpg/330px-Home_Ghewar_sweet.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="ghewar">
      <div class="item-info">
        <p class="item-name">ghewar<span class="price">59 rupees</span></p>
        <!-- No description provided -->
      </div>
    </div>
  </section>
</div>
</body>
</html>
