<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Kulhad – Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fdf7f2;
    --primary: #6b2c1e;
    --secondary: #c96c47;
    --accent: #e0a96d;
    --text: #3a2c2a;
    --muted: #7a6e6b;
    --radius: .6rem;
    --max-width: 1100px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family: 'Source Sans Pro', sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height:1.6;
    padding: 2rem 1rem;
    display:flex;
    justify-content:center;
  }
  .container{
    max-width: var(--max-width);
    width:100%;
  }
  header{
    text-align:center;
    margin-bottom: 2.5rem;
  }
  h1{
    font-family: 'Playfair Display', serif;
    font-size: 2.8rem;
    color: var(--primary);
    margin-bottom:.3rem;
  }
  .tagline{
    font-size:1.1rem;
    color: var(--muted);
  }
  .section{
    margin-bottom:2rem;
    background:#fff;
    border-radius:var(--radius);
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    overflow:hidden;
  }
  .section-title{
    background:var(--secondary);
    color:#fff;
    padding:.9rem 1.2rem;
    font-weight:600;
    font-size:1.3rem;
  }
  .items{
    padding:1rem;
  }
  .item{
    display:flex;
    flex-direction:column;
    margin-bottom:1.4rem;
  }
  .item-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:.3rem;
  }
  .item-name{
    font-weight:600;
    font-size:1.1rem;
    color:var(--primary);
  }
  .price{
    font-weight:600;
    color:var(--accent);
    white-space: nowrap;
    margin-left:1rem;
  }
  .item-description{
    font-size:.95rem;
    color:var(--muted);
    margin-left:.2rem;
  }
  .item-img{
    width:80px;
    height:80px;
    object-fit:cover;
    border-radius:var(--radius);
    margin-top:.5rem;
    align-self:flex-start;
  }
  @media (min-width:600px){
    .item{
      flex-direction:row;
      align-items:flex-start;
    }
    .item-header{
      flex:1 1 auto;
    }
    .item-description{
      flex:2 1 60%;
    }
    .item-img{
      margin-left:1rem;
      margin-top:0;
    }
  }
  .empty{
    font-style:italic;
    color:var(--muted);
    padding:1rem;
    text-align:center;
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <h1>Kulhad</h1>
  </header>

  <section class="section">
    <div class="section-title">Desserts</div>
    <div class="items">
      <div class="empty">Menu coming soon…</div>
    </div>
  </section>
</div>
</body>
</html>
