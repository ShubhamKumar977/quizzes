<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>kulhad Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff8f0;
    --primary:#5d4037;
    --accent:#d2691e;
    --muted:#8d6e63;
    --text:#4e342e;
    --border:#e0c9b6;
  }
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
  }
  .wrapper{
    max-width:960px;
    margin:0 auto;
    padding:2rem 1rem;
  }
  header{
    text-align:center;
    padding-bottom:2rem;
    border-bottom:3px solid var(--accent);
  }
  header h1{
    font-family:'Crimson Pro',serif;
    font-size:3rem;
    margin:0;
    color:var(--primary);
    letter-spacing:.04em;
  }
  header p{
    margin-top:.5rem;
    font-size:1.1rem;
    color:var(--muted);
    font-style:italic;
  }
  section{
    margin-top:2.5rem;
  }
  .section-title{
    font-family:'Crimson Pro',serif;
    font-size:2rem;
    color:var(--primary);
    border-left:5px solid var(--accent);
    padding-left:.8rem;
    margin-bottom:1rem;
  }
  .menu-item{
    display:flex;
    align-items:flex-start;
    gap:1.2rem;
    padding:.8rem 0;
    border-bottom:1px dotted var(--border);
    flex-wrap:wrap;
  }
  .menu-item img{
    width:100px;
    height:100px;
    object-fit:cover;
    border-radius:.6rem;
    flex-shrink:0;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
  }
  .item-details{
    flex:1;
    min-width:0;
  }
  .item-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
  }
  .item-name{
    font-weight:600;
    font-size:1.2rem;
    color:var(--primary);
    margin:0;
  }
  .price{
    font-weight:600;
    color:var(--accent);
    white-space:nowrap;
    font-size:1.1rem;
  }
  .item-desc{
    margin-top:.4rem;
    font-size:.95rem;
    color:var(--muted);
  }
  @media(max-width:480px){
    header h1{font-size:2.4rem;}
    .section-title{font-size:1.6rem;}
    .menu-item{
      flex-direction:column;
      align-items:center;
      text-align:center;
    }
    .menu-item img{
      width:80px;
      height:80px;
    }
    .item-header{
      width:100%;
      justify-content:center;
    }
    .price{
      margin-top:.3rem;
    }
  }
</style>
</head>
<body>
<div class="wrapper">
  <header>
    <h1>kulhad</h1>
    <p></p>
  </header>

  <section>
    <h2 class="section-title">Desserts</h2>
    <div class="menu-item">
      <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/1/1e/Home_Ghewar_sweet.jpg/330px-Home_Ghewar_sweet.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail" alt="ghewar">
      <div class="item-details">
        <div class="item-header">
          <p class="item-name">ghewar</p>
          <span class="price">₹252</span>
        </div>
        <!-- No description provided -->
      </div>
    </div>
  </section>
</div>
</body>
</html>
